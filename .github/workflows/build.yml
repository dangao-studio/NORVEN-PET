name: 打包 Windows 版

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝工具
        run: npm install

      - name: 打包
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: NovumPet-Windows
          path: dist/*.exe
          retention-days: 30
